{% extends 'mailing_service/base.html' %}
{% load static %}

{% block title %}Пароль изменен{% endblock %}

{% block content %}
<div class="container">
    <header class="text-center py-5">
        <h1 class="display-4">Пароль изменен</h1>
        <p class="lead">Ваш пароль успешно изменен</p>
    </header>

    <div class="row justify-content-center">
        <div class="col-8">
            <div class="border p-4 rounded text-center">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                <h3 class="mt-3">Успешно!</h3>
                <p class="mb-4">Ваш пароль был успешно изменен.</p>
                <div class="d-flex gap-2">
                    <a href="{% url 'users:profile_user' %}" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-person me-2"></i>
                        Вернуться в профиль
                    </a>
                    <a href="{% url 'mailing_service:home' %}" class="btn btn-outline-secondary flex-grow-1">
                        <i class="bi bi-house me-2"></i>
                        На главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
