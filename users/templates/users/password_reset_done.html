{% extends 'mailing_service/base.html' %}
{% load static %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="container">
    <header class="text-center py-5">
        <h1 class="display-4">Письмо отправлено</h1>
        <p class="lead">Проверьте вашу почту</p>
    </header>

    <div class="row justify-content-center">
        <div class="col-8">
            <div class="border p-4 rounded text-center">
                <i class="bi bi-envelope-check text-success" style="font-size: 4rem;"></i>
                <h3 class="mt-3">Инструкция отправлена</h3>
                <p>Мы отправили вам инструкцию по восстановлению пароля на email.</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary mt-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Вернуться к входу
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
