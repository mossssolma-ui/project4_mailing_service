{% extends 'mailing_service/base.html' %}
{% load static %}

{% block title %}Пароль восстановлен{% endblock %}

{% block content %}
<div class="container">
    <header class="text-center py-5">
        <h1 class="display-4">Пароль восстановлен</h1>
        <p class="lead">Вы можете войти в систему</p>
    </header>

    <div class="row justify-content-center">
        <div class="col-8">
            <div class="border p-4 rounded text-center">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                <h3 class="mt-3">Пароль успешно изменен</h3>
                <p>Теперь вы можете войти в систему с новым паролем.</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary mt-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Войти
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
