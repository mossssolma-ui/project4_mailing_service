{% extends 'mailing_service/base.html' %}
{% load static %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<div class="container">
    <header class="text-center py-5">
        <h1 class="display-4">Новый пароль</h1>
        <p class="lead">Введите новый пароль</p>
    </header>

    <div class="row justify-content-center">
        <div class="col-8">
            <form method="post" class="border p-4 rounded">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <div class="mb-3">
                    <label for="{{ form.new_password1.id_for_label }}" class="form-label">Новый пароль</label>
                    <input type="password"
                           name="{{ form.new_password1.name }}"
                           id="{{ form.new_password1.id_for_label }}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="{{ form.new_password2.id_for_label }}" class="form-label">Подтверждение пароля</label>
                    <input type="password"
                           name="{{ form.new_password2.name }}"
                           id="{{ form.new_password2.id_for_label }}"
                           class="form-control"
                           required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-check-lg me-2"></i>
                        Сохранить пароль
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
