{% extends 'mailing_service/base.html' %}
{% load static %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="container">
    <header class="text-center py-5">
        <h1 class="display-4">Восстановление пароля</h1>
        <p class="lead">Введите ваш email для восстановления пароля</p>
    </header>

    <div class="row justify-content-center">
        <div class="col-8">
            <form method="post" class="border p-4 rounded">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <div class="mb-3">
                    <label for="id_email" class="form-label">Email</label>
                    <input type="email" name="email" id="id_email" class="form-control" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-envelope me-2"></i>
                        Отправить ссылку
                    </button>
                    <a href="{% url 'users:login' %}" class="btn btn-outline-secondary flex-grow-1">
                        <i class="bi bi-arrow-left me-2"></i>
                        Назад
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
