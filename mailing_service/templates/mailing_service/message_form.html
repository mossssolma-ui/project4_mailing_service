{% extends 'mailing_service/base.html' %}
{% load static %}

{% block title %}{% if object %}Редактирование{% else %}Создание{% endif %} сообщения {% endblock %}

{% block content %}
<main>
    <div class="container my-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow">
                    <div class="card-body">
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}

                            {{ form.non_field_errors }}
                            {{ form.as_p }}

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-2"></i>
                                    {% if object %}Сохранить изменения{% else %}Создать сообщение{% endif %}
                                </button>
                                <a href="{% url 'mailing_service:message_list' %}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg me-2"></i>Отмена
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
