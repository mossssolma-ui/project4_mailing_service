{% load static %}
<!doctype html>
<html lang="ru" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис управления рассылками сообщений{% endblock %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet"/>
    <style>
        .wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Навигация -->
        {% include 'mailing_service/includes/inc_nav.html' %}

        <!-- Основной контент -->
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>

        <!-- Футер -->
        {% include 'mailing_service/includes/inc_footer.html' %}
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
