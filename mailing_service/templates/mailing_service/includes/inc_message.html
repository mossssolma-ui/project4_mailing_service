{% load static %}

<div class="container mt-3">
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th style="width: 50px;">№</th>
                    <th style="width: 25%;">Тема</th>
                    <th style="width: 30%;">Текст</th>
                    <th style="width: 15%;">Дата создания</th>
                    <th style="width: 15%;">Дата изменения</th>
                    <th style="width: 10%;">Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for mes in message %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ mes.title }}</td>
                    <td>{{ mes.content|truncatewords:10 }}</td>
                    <td>{{ mes.created_at|date:"d.m.Y H:i" }}</td>
                    <td>{{ mes.updated_at|date:"d.m.Y H:i" }}</td>
                    <td>
                        <div class="d-flex gap-1">
                            <a href="{% url 'mailing_service:message_update' mes.pk %}"
                               class="btn btn-sm btn-outline-primary"
                               title="Редактировать">Р</a>
                            <a href="{% url 'mailing_service:message_details' mes.pk %}"
                               class="btn btn-sm btn-outline-info"
                               title="Просмотр">П</a>
                            <a href="{% url 'mailing_service:message_delete' mes.pk %}"
                               class="btn btn-sm btn-outline-danger"
                               title="Удалить">У</a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="6" class="text-center">
                        <div class="alert alert-info mb-0">Нет сообщений</div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
